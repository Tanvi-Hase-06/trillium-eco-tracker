<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrilliumEco Tracker</title>
    <style>
        body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #111827; border: 1px solid #374151; border-radius: 12px; padding: 20px; width: 100%; max-width: 500px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #10b981; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        .row { display: flex; justify-content: space-between; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Enter Data</h2>
        <input type="number" id="kwh" placeholder="Monthly kWh">
        <input type="number" id="petrol" placeholder="Daily Petrol km">
        <input type="number" id="ebike" placeholder="Daily E-Bike km">
        <button id="calcBtn">Calculate Footprint</button>
    </div>

    <div class="card" id="results" style="display:none;">
        <h2>Results</h2>
        <div class="row"><span>Gross:</span> <span id="gross">0</span></div>
        <div class="row"><span>Target:</span> <span id="target">0</span></div>
        <input type="checkbox" id="solar"> Solar (-800kg)<br>
        <input type="checkbox" id="vampire"> Vampire Loads (-150kg)<br>
        <input type="checkbox" id="evsolar"> Solar EV Charge (-250kg)
    </div>

    <script>
        // Force the function to be attached to the window so it is accessible
        window.calculate = function() {
            var kwh = parseFloat(document.getElementById('kwh').value) || 0;
            var petrol = parseFloat(document.getElementById('petrol').value) || 0;
            var ebike = parseFloat(document.getElementById('ebike').value) || 0;
            
            var gross = (kwh * 0.85 * 12) + (petrol * 0.21 * 365) + (ebike * 0.01 * 0.5 * 30 * 12);
            
            var saved = 0;
            if(document.getElementById('solar').checked) saved += 800;
            if(document.getElementById('vampire').checked) saved += 150;
            if(document.getElementById('evsolar').checked) saved += 250;
            
            var target = gross - saved;
            if(target < 0) target = 0;
            
            document.getElementById('results').style.display = 'block';
            document.getElementById('gross').innerText = gross.toFixed(1) + " kg/yr";
            document.getElementById('target').innerText = target.toFixed(1) + " kg/yr";
        };

        // Attach listeners
        document.getElementById('calcBtn').onclick = window.calculate;
        document.getElementById('solar').onchange = window.calculate;
        document.getElementById('vampire').onchange = window.calculate;
        document.getElementById('evsolar').onchange = window.calculate;
    </script>
</body>
</html>
